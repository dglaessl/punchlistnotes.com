<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Punch List</title>
<meta name="description" content="Punch List by Daniel Glaessl. Notes on AI, product design and how what we build shapes how we live. First issue 15 December 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one drawing sheet — a framed page with faint grid, the publication title as the drawing, a launch punch list, and a title block in the corner. */
:root {
  --paper: #f3f5f2;
  --sheet: #fbfcfa;
  --ink: #1a1f1c;
  --ink-soft: #57605a;
  --line: #c7cec8;
  --grid: rgba(26, 31, 28, 0.05);
  --redline: #c8402b;
  --font-display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1311; --sheet: #151a17; --ink: #e6e9e5; --ink-soft: #9aa39d;
    --line: #333b36; --grid: rgba(230, 233, 229, 0.045); --redline: #f26b52;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1311; --sheet: #151a17; --ink: #e6e9e5; --ink-soft: #9aa39d;
  --line: #333b36; --grid: rgba(230, 233, 229, 0.045); --redline: #f26b52;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1.0625rem;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: clamp(16px, 5vw, 56px);
  display: grid;
  place-items: center;
}

.sheet {
  position: relative;
  width: 100%;
  max-width: 960px;
  background-color: var(--sheet);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  border: 1.5px solid var(--ink);
  outline: 1px solid var(--line);
  outline-offset: 6px;
  padding: clamp(24px, 6vw, 64px);
  display: grid;
  gap: clamp(32px, 6vw, 56px);
}

.eyebrow {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-soft);
  display: flex;
  flex-wrap: wrap;
  gap: 8px 24px;
}

h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-stretch: 68%;
  font-variation-settings: "wdth" 68;
  font-size: clamp(4rem, 17vw, 10.5rem);
  line-height: 0.86;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  text-wrap: balance;
}
h1 .mark {
  position: relative;
  display: inline-block;
}
/* the redline cloud: an architect's revision mark around one word */
h1 .mark svg {
  position: absolute;
  inset: -10% -6%;
  width: 112%;
  height: 120%;
  overflow: visible;
  pointer-events: none;
}
h1 .mark path {
  fill: none;
  stroke: var(--redline);
  stroke-width: 2.2;
  vector-effect: non-scaling-stroke;
  stroke-dasharray: 1400;
  stroke-dashoffset: 0;
}
@media (prefers-reduced-motion: no-preference) {
  h1 .mark path { animation: draw 1.6s 0.3s ease-out both; }
  @keyframes draw { from { stroke-dashoffset: 1400; } to { stroke-dashoffset: 0; } }
}

.lede {
  display: grid;
  gap: 12px;
  max-width: 34rem;
}
.positioning {
  margin: 0;
  font-family: var(--font-body);
  font-style: italic;
  font-size: clamp(1.5rem, 3.6vw, 2.125rem);
  line-height: 1.2;
  text-wrap: balance;
}
.tagline {
  margin: 0;
  color: var(--ink-soft);
}

.lower {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 300px);
  gap: clamp(32px, 6vw, 64px);
  align-items: end;
}
@media (max-width: 720px) {
  .lower { grid-template-columns: minmax(0, 1fr); }
}

.punch h2 {
  margin: 0 0 12px;
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: 0.75rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.punch ol {
  list-style: none;
  margin: 0;
  padding: 0;
  border-top: 1px solid var(--line);
}
.punch li {
  display: grid;
  grid-template-columns: 2.25rem 1.5rem minmax(0, 1fr);
  align-items: baseline;
  gap: 8px;
  padding-block: 10px;
  border-bottom: 1px solid var(--line);
}
.punch .no {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.punch .box {
  width: 14px;
  height: 14px;
  border: 1.5px solid var(--ink);
  position: relative;
  top: 2px;
}
.punch .done .box::after {
  content: "";
  position: absolute;
  left: 3px;
  top: -4px;
  width: 6px;
  height: 12px;
  border-right: 2px solid var(--redline);
  border-bottom: 2px solid var(--redline);
  transform: rotate(40deg);
}
.punch .done .item { color: var(--ink-soft); }
.punch .open .item { font-weight: 500; }
.punch .item time { white-space: nowrap; }

.first-issue {
  margin: 0;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  font-family: var(--font-display);
  font-weight: 700;
  font-stretch: 68%;
  font-variation-settings: "wdth" 68;
  font-size: clamp(1.375rem, 3vw, 1.75rem);
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.first-issue time { color: var(--redline); }

.titleblock {
  border: 1.5px solid var(--ink);
  font-family: var(--font-mono);
  font-size: 0.75rem;
  line-height: 1.35;
  display: grid;
  grid-template-columns: 1fr 1fr;
}
.titleblock div {
  padding: 8px 10px;
  border-bottom: 1px solid var(--ink);
  display: grid;
  gap: 2px;
  min-width: 0;
}
.titleblock div:nth-child(odd) { border-right: 1px solid var(--ink); }
.titleblock .wide { grid-column: 1 / -1; border-right: 0; }
.titleblock div:last-child,
.titleblock div:nth-last-child(2):not(.wide) { border-bottom: 0; }
.titleblock span {
  font-size: 0.625rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.titleblock strong {
  font-weight: 500;
  color: var(--ink);
  overflow-wrap: anywhere;
}
.titleblock .wide strong {
  font-family: var(--font-display);
  font-stretch: 68%;
  font-variation-settings: "wdth" 68;
  font-weight: 800;
  font-size: 1.375rem;
  letter-spacing: 0.01em;
  text-transform: uppercase;
}
</style>
<style>.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}</style>
</head>
<body>
<main class="sheet">
  <div class="eyebrow" aria-hidden="true">
    <span>Sheet 00 — Cover</span>
    <span>Issue for launch</span>
    <span>Scale: 1:1</span>
  </div>

  <header class="lede-wrap">
    <h1>Punch <span class="mark">List<svg viewBox="0 0 200 100" preserveAspectRatio="none" aria-hidden="true"><path d="M14 52 C 6 30, 30 14, 46 20 C 54 4, 86 4, 96 16 C 108 2, 146 4, 152 18 C 172 8, 196 26, 188 46 C 202 62, 184 90, 160 84 C 150 98, 112 98, 102 86 C 90 100, 54 98, 46 84 C 24 94, 0 74, 14 52 Z"/></svg></span></h1>
  </header>

  <section class="lede">
    <p class="positioning">I design products people live with.</p>
    <p class="tagline">Notes on AI, product design and how what we build shapes how we live, by Daniel Glaessl.</p>
  </section>

  <div class="lower">
    <p class="first-issue">First issue <time datetime="2026-12-15">15 December 2026</time></p>

    <aside class="titleblock" aria-label="Title block">
      <div class="wide"><span>Project</span><strong>Punch List</strong></div>
      <div><span>Author</span><strong>Daniel Glaessl</strong></div>
      <div><span>Status</span><strong>In design</strong></div>
      <div><span>First issue</span><strong>15.12.2026</strong></div>
      <div><span>Rev</span><strong>A</strong></div>
    </aside>
  </div>
</main>
</body>
</html>
